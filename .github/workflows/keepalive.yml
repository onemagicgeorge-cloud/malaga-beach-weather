name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update last-keepalive
        run: date > LAST_KEEPALIVE
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Monthly keepalive commit"
